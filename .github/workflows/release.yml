# Publishes a MACH release when a version tag is pushed: the visual Product Studio's host program,
# built for each supported machine with the web app embedded, plus SHA256SUMS. The installer
# (bin/mach) downloads the file for the person's machine from this release and checks it against
# SHA256SUMS, so the file names here and in bin/mach must stay the same.
#
# Run by hand (workflow_dispatch) it builds and smoke-tests everything and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the plugin's version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json version $version" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/studio/go.mod
          cache-dependency-path: apps/studio/go.mod

      - name: Test the engine, the installer and the host
        run: |
          python3 -m unittest tests.test_installer tests.test_mach_product_studio tests.test_mach_product_host
          cd apps/studio && go vet ./... && go test ./...

      - name: Build the host for every supported machine
        run: |
          mkdir -p dist
          (cd web && pnpm install --frozen-lockfile)
          for target in darwin/arm64 linux/arm64 linux/amd64; do
            SKIP_INSTALL=1 CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              OUT="$PWD/dist/mach-studio-${target%/*}-${target#*/}" sh apps/studio/build.sh
          done
          (cd dist && sha256sum mach-studio-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: hosts
          path: dist/
          if-no-files-found: error

  # Each program is started on a machine of its own kind before anything is published.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, file: mach-studio-linux-amd64 }
          - { runner: ubuntu-24.04-arm, file: mach-studio-linux-arm64 }
          - { runner: macos-latest, file: mach-studio-darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hosts
          path: dist
      - name: Start it, open the link, ask the engine for status
        run: |
          chmod +x "dist/${{ matrix.file }}"
          sh apps/studio/smoke.sh "dist/${{ matrix.file }}"

  publish:
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and attach files
      id-token: write        # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hosts
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/mach-studio-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "MACH ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
